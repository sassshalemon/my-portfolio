<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#f6ead8"/>
<title>Hamster Home</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",Arial,sans-serif;background:#eee3d5;color:#5d432f}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#edf4de,#f8ecd9 25%,#ead2ad);position:relative}.top{display:flex;align-items:center;gap:7px;padding:max(8px,env(safe-area-inset-top)) 9px 7px;z-index:3}.avatar{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff6e8 0 22%,#d78d3e 23% 53%,#9a5c27 54%);border:4px solid #fff8ef;box-shadow:0 3px 8px #6e4b2830;position:relative;flex:none}.avatar:before{content:'🐹';position:absolute;font-size:39px;inset:3px;text-align:center}.lvl{position:absolute;left:-5px;bottom:-4px;background:#ffb42b;color:white;font-weight:900;border:2px solid white;border-radius:9px;padding:2px 7px}.res{display:flex;gap:6px;flex:1}.pill{height:42px;flex:1;min-width:0;background:#fffaf3;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 8px #70502e25;font-size:13px;font-weight:900}.pill b{white-space:nowrap}.plus{width:23px;height:23px;border:0;border-radius:50%;background:#8ebe42;color:#fff;font-weight:900;font-size:18px;padding:0}.sceneWrap{padding:0 9px}.scene{position:relative;height:min(54vh,470px);border-radius:28px 28px 22px 22px;background:linear-gradient(90deg,#b77a3e,#e9b96f 5%,#f1ca88 94%,#a86631);border:7px solid #d79a55;box-shadow:0 8px 22px #63421f35;overflow:hidden}.inside{position:absolute;inset:0;background:linear-gradient(#dcb079 0 48%,#bb814b 48% 50%,#e1b579 50% 100%)}.inside:before,.inside:after{content:'';position:absolute;left:0;right:0;height:11px;background:linear-gradient(#8e572c,#d69b5a,#815025);box-shadow:0 4px 8px #54311444}.inside:before{top:48%}.inside:after{bottom:1%}.bedding{position:absolute;left:0;right:0;bottom:0;height:17%;background:repeating-linear-gradient(12deg,#f7dfae 0 5px,#e9c781 5px 9px,#f3d9a5 9px 13px)}.house{position:absolute;left:7%;top:8%;width:30%;height:31%;border-radius:48% 48% 16% 16%;background:linear-gradient(90deg,#c68345,#f0ba74,#af6b36);box-shadow:inset 0 0 0 5px #a96632,0 6px 8px #66401e40}.house:after{content:'';position:absolute;left:29%;bottom:0;width:42%;height:51%;border-radius:50% 50% 0 0;background:#624022;box-shadow:inset 8px 0 10px #29170c}.bowl{position:absolute;left:58%;top:35%;width:23%;height:12%;border-radius:12% 12% 50% 50%;background:linear-gradient(#a7da53,#73a72b);box-shadow:inset 0 5px #d6f28e,0 4px 5px #60461f45}.bowl:before{content:'••••••';letter-spacing:1px;color:#a7652d;position:absolute;left:8%;right:8%;top:-6px;font-size:15px;white-space:nowrap;overflow:hidden}.water{position:absolute;right:6%;top:10%;width:14%;height:30%;border-radius:14px;background:linear-gradient(90deg,#dff7ff90,#fff9,#85d7ef90);border:5px solid #2b87bf;box-shadow:inset 0 -44px #5bc5eb70}.water:before{content:'💧';position:absolute;inset:28% 0 auto;text-align:center;font-size:25px}.water:after{content:'';position:absolute;width:39px;height:10px;background:#80868a;bottom:-11px;left:-20px;transform:rotate(30deg);border-radius:7px}.wheel{position:absolute;left:7%;bottom:7%;width:36%;aspect-ratio:1;border-radius:50%;border:11px solid #2c79a8;background:repeating-conic-gradient(#2c79a8 0 4deg,transparent 4deg 27deg);box-shadow:inset 0 0 0 7px #d6e4e7,0 5px 8px #51331d50;transition:.3s}.wheel:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#2c79a8;left:38%;top:38%;box-shadow:0 0 0 5px #d5c6a7}.wheel.locked{filter:grayscale(.8);opacity:.42}.wheel.running{animation:spin .45s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tunnel{position:absolute;right:9%;bottom:9%;width:29%;height:22%;border-radius:50% 50% 13px 13px;background:linear-gradient(90deg,#a66536,#e7b272,#9b5d31);box-shadow:inset 0 0 0 5px #8a532e}.tunnel:after{content:'';position:absolute;left:24%;right:24%;bottom:0;height:72%;border-radius:50% 50% 0 0;background:#604022}.ladder{position:absolute;left:47%;top:47%;width:10%;height:42%;transform:rotate(8deg);border-left:5px solid #9a622f;border-right:5px solid #9a622f;background:repeating-linear-gradient(#0000 0 20px,#9a622f 21px 27px)}.hamster{position:absolute;width:84px;height:70px;left:44%;top:27%;z-index:3;transition:left 1.05s cubic-bezier(.2,.8,.2,1),top 1.05s cubic-bezier(.2,.8,.2,1),transform .25s}.hamster .body{position:absolute;left:7px;top:13px;width:70px;height:54px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 48% 55%,#fff1d6 0 24%,transparent 25%),linear-gradient(90deg,#ad642d,#e9a556 42%,#d8893f 75%,#9b582a);box-shadow:0 7px 8px #5e391e38}.hamster .head{position:absolute;left:18px;top:0;width:50px;height:44px;border-radius:52%;background:linear-gradient(90deg,#bd7136,#efad61,#c67a3d)}.ear{position:absolute;top:-5px;width:17px;height:17px;border-radius:50%;background:#b86639;box-shadow:inset 0 0 0 5px #efad91}.e1{left:2px}.e2{right:1px}.eye{position:absolute;top:16px;width:7px;height:8px;border-radius:50%;background:#17120e;box-shadow:inset 2px 1px #fff}.eye.a{left:11px}.eye.b{right:10px}.nose{position:absolute;left:22px;top:26px;width:7px;height:6px;border-radius:50%;background:#ef8f8f}.hamster:after{content:'ʚ ɞ';position:absolute;left:26px;top:42px;color:#efc8b0;font-weight:900}.bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;background:#fff9f1e8;padding:7px 12px;border-radius:18px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.bubble.show{opacity:1}.stats{display:flex;gap:6px;padding:7px 9px 0}.stat{flex:1;background:#fff9ef;border-radius:14px;padding:6px 8px;font-size:9px;font-weight:900}.bar{height:6px;background:#e4d3bb;border-radius:8px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#8fc248;border-radius:8px;transition:.3s}.task{margin:7px 9px 0;padding:9px 11px;background:#fffaf3;border-radius:19px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px #68431e24;min-height:65px}.taskIcon{font-size:34px}.taskTxt{flex:1}.taskTxt b{font-size:13px}.taskTxt small{display:block;color:#9c7856;margin-top:3px}.go{border:0;background:#91c743;color:#fff;border-radius:15px;min-width:49px;height:43px;font-size:21px;font-weight:900}.nav{margin-top:auto;padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:flex;gap:7px}.nav button{flex:1;border:0;background:#fffaf2;border-radius:19px;height:68px;font-weight:900;color:#735137;box-shadow:0 4px 10px #60401d25;font-size:9px}.nav span{display:block;font-size:27px;margin-bottom:2px}.sheetBack{position:absolute;inset:0;background:#3d281d66;z-index:20;display:none;align-items:flex-end}.sheetBack.open{display:flex}.sheet{width:100%;background:#fff9f0;border-radius:28px 28px 0 0;padding:12px 15px calc(24px + env(safe-area-inset-bottom));max-height:72%;overflow:auto}.handle{width:44px;height:5px;background:#d8c1a4;border-radius:9px;margin:0 auto 9px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead h2{margin:0 0 10px}.x{border:0;background:#edddca;border-radius:50%;width:34px;height:34px;font-size:20px}.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eedec9;border-radius:17px;padding:10px;margin:8px 0}.itemIcon{font-size:35px}.itemText{flex:1}.itemText b{display:block}.itemText small{color:#947358}.buy{border:0;border-radius:12px;background:#83bf40;color:#fff;font-weight:900;padding:10px 12px}.buy:disabled{background:#cfc2b4}.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:#4f3728e8;color:#fff;border-radius:18px;padding:9px 14px;font-size:12px;font-weight:800;opacity:0;transition:.25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="avatar"><div class="lvl" id="level">1</div></div><div class="res"><div class="pill">🪙 <b id="coins">1000</b><button class="plus">+</button></div><div class="pill">💎 <b id="gems">50</b><button class="plus">+</button></div><div class="pill">❤️ <b>5/5</b><button class="plus">+</button></div></div></div>
<div class="sceneWrap"><div class="scene"><div class="inside"></div><div class="bedding"></div><div class="house" data-action="sleep"></div><div class="bowl" data-action="eat"></div><div class="water" data-action="drink"></div><div class="wheel locked" id="wheel" data-action="wheel"></div><div class="tunnel"></div><div class="ladder"></div><div class="hamster" id="ham"><div class="body"></div><div class="head"><i class="ear e1"></i><i class="ear e2"></i><i class="eye a"></i><i class="eye b"></i><i class="nose"></i></div></div><div class="bubble" id="bubble">Hammy is exploring 🐹</div></div></div>
<div class="stats"><div class="stat">FOOD <b id="foodN">78</b><div class="bar"><div class="fill" id="foodB" style="width:78%"></div></div></div><div class="stat">WATER <b id="waterN">82</b><div class="bar"><div class="fill" id="waterB" style="width:82%"></div></div></div><div class="stat">HAPPY <b id="happyN">74</b><div class="bar"><div class="fill" id="happyB" style="width:74%"></div></div></div></div>
<div class="task" id="task"><div class="taskIcon">🎡</div><div class="taskTxt"><b id="taskTitle">Build the First Wheel</b><small id="taskProgress">0/1 • reward +150</small></div><button class="go" id="taskBtn">›</button></div>
<div class="nav"><button data-sheet="shop"><span>🏪</span>SHOP</button><button data-sheet="build"><span>🔨</span>BUILD</button><button data-sheet="tasks"><span>📋</span>TASKS</button><button data-sheet="decorate"><span>🪴</span>DECORATE</button></div>
<div class="sheetBack" id="back"><div class="sheet"><div class="handle"></div><div class="sheetHead"><h2 id="sheetTitle">Build</h2><button class="x" id="close">×</button></div><div id="sheetBody"></div></div></div><div class="toast" id="toast"></div>
</div>
<script>
const saveKey='hamster-home-live-v1';let s={coins:1000,gems:50,food:78,water:82,happy:74,wheel:false,claimed:false,level:1};try{s={...s,...JSON.parse(localStorage.getItem(saveKey)||'{}')}}catch(e){}
const $=id=>document.getElementById(id),ham=$('ham'),wheel=$('wheel'),bubble=$('bubble'),toast=$('toast');
const spots={idle:[44,27],eat:[57,35],drink:[72,20],sleep:[18,20],wheel:[14,62]};let bubbleTimer,toastTimer;
function clamp(n){return Math.max(0,Math.min(100,n))}function save(){localStorage.setItem(saveKey,JSON.stringify(s))}function render(){$('coins').textContent=s.coins;$('gems').textContent=s.gems;$('level').textContent=s.level;[['food',s.food],['water',s.water],['happy',s.happy]].forEach(([k,v])=>{$(k+'N').textContent=Math.round(v);$(k+'B').style.width=v+'%'});wheel.classList.toggle('locked',!s.wheel);if(s.claimed){$('taskTitle').textContent='First Wheel Complete!';$('taskProgress').textContent='Reward claimed';$('taskBtn').textContent='✓'}else if(s.wheel){$('taskProgress').textContent='1/1 • tap to claim +150';$('taskBtn').textContent='+150'}else{$('taskProgress').textContent='0/1 • reward +150';$('taskBtn').textContent='›'}save()}
function say(t){bubble.textContent=t;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),1800)}function pop(t){toast.textContent=t;toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('on'),1700)}function move(k){let [x,y]=spots[k];ham.style.left=x+'%';ham.style.top=y+'%'}
function doAction(k){if(k==='eat'){move('eat');setTimeout(()=>{if(s.coins<20)return pop('Need 20 coins');s.coins-=20;s.food=clamp(s.food+22);say('Crunch crunch! 🥕');render()},650)}if(k==='drink'){move('drink');setTimeout(()=>{s.water=clamp(s.water+20);say('Tiny sip 💧');render()},650)}if(k==='sleep'){move('sleep');setTimeout(()=>{s.happy=clamp(s.happy+6);say('Cozy nap… zzz');render()},650)}if(k==='wheel'){if(!s.wheel)return openSheet('build');move('wheel');setTimeout(()=>{wheel.classList.add('running');s.happy=clamp(s.happy+12);say('Zoom zoom!');render();setTimeout(()=>wheel.classList.remove('running'),2600)},700)}}
document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>doAction(el.dataset.action));ham.onclick=()=>{s.happy=clamp(s.happy+3);ham.style.transform='scale(1.12)';say('Hammy loves pets ❤️');setTimeout(()=>ham.style.transform='',250);render()};
const back=$('back'),body=$('sheetBody');function item(icon,title,sub,price,button,action,disabled=false){return `<div class="item"><div class="itemIcon">${icon}</div><div class="itemText"><b>${title}</b><small>${sub}${price!=null?' • 🪙 '+price:''}</small></div><button class="buy" ${disabled?'disabled':''} onclick="${action}">${button}</button></div>`}function openSheet(type){$('sheetTitle').textContent=({shop:'Hammy Shop',build:'Build Mode',tasks:'Tasks',decorate:'Decorate'})[type]||'Hammy';if(type==='build')body.innerHTML=item('🎡','Exercise Wheel',s.wheel?'Already built':'A place for Hammy to run',s.wheel?null:250,s.wheel?'BUILT':'BUILD','buildWheel()',s.wheel)+item('🔒','Second floor','Unlocks at Level 5',null,'LOCKED','',true);if(type==='shop')body.innerHTML=item('🥕','Fresh Food','Restores hunger',20,'BUY','buyFood()')+item('🍓','Berry Mix','Unlocks at Level 3',null,'LOCKED','',true);if(type==='tasks')body.innerHTML=item('🎡','Build the First Wheel',s.claimed?'Completed':s.wheel?'Ready to claim':'Place an exercise wheel',null,s.claimed?'DONE':s.wheel?'CLAIM':'GO',s.wheel?'claimTask()':'buildWheel()',s.claimed);if(type==='decorate')body.innerHTML=item('🪴','Tiny plant','Cute decoration',120,'BUY','buyDecor()')+item('✨','Fairy lights','Unlocks at Level 3',null,'LOCKED','',true);back.classList.add('open')}
function closeSheet(){back.classList.remove('open')}$('close').onclick=closeSheet;back.onclick=e=>{if(e.target===back)closeSheet()};document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));
window.buildWheel=()=>{if(s.wheel)return;if(s.coins<250)return pop('Need 250 coins');s.coins-=250;s.wheel=true;s.happy=clamp(s.happy+10);closeSheet();pop('Wheel built! 🎡');render()};window.claimTask=()=>{if(!s.wheel||s.claimed)return;s.coins+=150;s.claimed=true;closeSheet();pop('+150 coins!');render()};window.buyFood=()=>{if(s.coins<20)return pop('Need 20 coins');s.coins-=20;s.food=clamp(s.food+22);closeSheet();pop('Food restocked 🥕');render()};window.buyDecor=()=>{if(s.coins<120)return pop('Need 120 coins');s.coins-=120;s.happy=clamp(s.happy+5);closeSheet();pop('Tiny plant added 🪴');render()};$('taskBtn').onclick=()=>{if(s.wheel&&!s.claimed)claimTask();else if(!s.wheel)openSheet('build')};
setInterval(()=>{s.food=clamp(s.food-.6);s.water=clamp(s.water-.8);if(!s.wheel)s.happy=clamp(s.happy-.25);render()},12000);const acts=['idle','eat','drink','sleep'];setInterval(()=>{let a=acts[Math.floor(Math.random()*acts.length)];if(a==='eat'&&s.food>90)a='idle';if(a==='drink'&&s.water>90)a='idle';move(a);if(a==='idle')say('Hammy is exploring 🐹')},6500);render();setTimeout(()=>say('Tap objects to care for Hammy 🐹'),600);
</script>
</body></html>

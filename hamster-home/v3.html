<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7eddf">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hamster Home</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9dfd2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Arial Rounded MT Bold",Arial,sans-serif;color:#67472f}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,480px);aspect-ratio:376/668;max-height:100dvh;overflow:hidden;background:linear-gradient(#eff3dd,#f7ead7 30%,#ead3b2);box-shadow:0 0 42px #50351e2b}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .25s}.art.ready{opacity:1}.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:40;background:linear-gradient(#eff3dd,#f7ead7 30%,#ead3b2);transition:.25s}.loader.hide{opacity:0;pointer-events:none}.loaderBox{text-align:center;font-weight:900}.loaderBox span{display:block;font-size:45px;animation:bob .8s ease-in-out infinite alternate}.loaderBox small{display:block;margin-top:8px;color:#9d7959}@keyframes bob{to{transform:translateY(-7px) rotate(3deg)}}.hot{position:absolute;border:0;background:transparent;padding:0;z-index:6;cursor:pointer}.hot:active{transform:scale(.965)}.ham{left:41%;top:22%;width:27%;height:16%}.bowl{left:58%;top:31%;width:26%;height:10%}.water{left:75%;top:17%;width:18%;height:22%}.wheel{left:6%;top:40%;width:40%;height:23%}.shop{left:3%;top:88%;width:23%;height:11%}.build{left:26%;top:88%;width:23%;height:11%}.tasks{left:50%;top:88%;width:23%;height:11%}.decor{left:74%;top:88%;width:23%;height:11%}.taskGo{left:77%;top:78%;width:16%;height:8%}.counter{position:absolute;z-index:7;display:grid;place-items:center;font-size:12px;font-weight:950;color:#513824;background:#fff9f0e8;border:1px solid #fff9;box-shadow:0 2px 8px #66421d20;border-radius:10px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.coins{left:27.5%;top:3.3%;width:13%;height:4.1%}.gems{left:51%;top:3.3%;width:9.5%;height:4.1%}.wheelCover{position:absolute;z-index:5;left:7.2%;top:40.7%;width:37%;height:21%;border-radius:28px;background:linear-gradient(135deg,#f9ead6e8,#e6d2b7dc);border:2px dashed #c69c6c;display:grid;place-items:center;text-align:center;box-shadow:inset 0 1px #fff,0 5px 13px #65431f22;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:.25s}.wheelCover.hidden{opacity:0;transform:scale(.88);pointer-events:none}.wheelCover b{display:block;font-size:31px;line-height:.8;color:#8fbe45;text-shadow:0 1px #fff}.wheelCover span{font-size:10px;font-weight:950;letter-spacing:.2px}.wheelFx{position:absolute;z-index:5;left:10.8%;top:42.2%;width:30%;aspect-ratio:1;border:7px solid transparent;border-top-color:#6fc8eb;border-right-color:#2e86bb;border-bottom-color:#a2d9ef;border-radius:50%;opacity:0;pointer-events:none;filter:drop-shadow(0 3px 4px #5f3a1c38)}.wheelFx.run{opacity:.95;animation:spin .55s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hearts{position:absolute;left:50%;top:26%;z-index:15;pointer-events:none}.heart{position:absolute;font-size:21px;font-weight:900;animation:heart 1s ease-out forwards}@keyframes heart{0%{opacity:0;transform:translateY(8px) scale(.55)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),-75px) scale(1.28)}}.toast{position:absolute;z-index:35;left:50%;bottom:13%;transform:translateX(-50%) translateY(7px);max-width:88%;overflow:hidden;text-overflow:ellipsis;background:#543a29e8;color:#fff;border:1px solid #ffffff3d;border-radius:22px;padding:10px 15px;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 8px 24px #3d291b45;opacity:0;transition:.2s}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.back{position:absolute;inset:0;z-index:25;background:#3d2b1e67;display:none;align-items:flex-end;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}.back.open{display:flex}.sheet{width:100%;max-height:70%;overflow:auto;background:linear-gradient(#fffaf4,#f8ecdc);border-radius:30px 30px 0 0;padding:10px 14px calc(19px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #3d281947;animation:up .22s ease-out}@keyframes up{from{transform:translateY(18px);opacity:.5}}.handle{width:42px;height:5px;border-radius:8px;background:#dcc5aa;margin:1px auto 8px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin:2px 0 9px;font-size:23px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#ebdbc8;color:#765740;font-size:21px;font-weight:700}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:3px}.tab{border:0;border-radius:13px;padding:7px 10px;background:#eedecb;color:#7b5a42;font-size:10px;font-weight:900;white-space:nowrap}.tab.active{background:#fff;box-shadow:0 2px 8px #66431f1e}.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #edddc7;border-radius:18px;margin:8px 0;padding:10px;box-shadow:0 3px 11px #66452213}.icon{width:53px;height:53px;flex:none;border-radius:15px;background:linear-gradient(#fff9ef,#efddc5);display:grid;place-items:center;font-size:31px;box-shadow:inset 0 1px #fff}.txt{flex:1;min-width:0}.txt b{display:block;font-size:14px}.txt small{display:block;color:#98775a;font-size:10px;margin-top:3px;line-height:1.25}.buy{border:0;border-radius:13px;background:linear-gradient(#a0d958,#76b239);color:#fff;font-weight:950;padding:10px 12px;box-shadow:inset 0 -2px #5b9228;min-width:59px}.buy:disabled{background:#d3c5b5;color:#fff;box-shadow:none}.status{background:#fff;border:1px solid #edddc7;border-radius:20px;padding:13px;margin-top:9px}.status b{font-size:14px}.status small{display:block;margin-top:5px;color:#957458}.bar{height:8px;border-radius:8px;background:#eadcc9;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#a2da55,#76b338);border-radius:8px}.claim{width:100%;border:0;border-radius:15px;margin-top:10px;padding:12px;background:linear-gradient(#a0d958,#76b239);color:#fff;font-size:14px;font-weight:950;box-shadow:inset 0 -2px #5c9428}.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.need{background:#fff;border:1px solid #ecdbc5;border-radius:16px;padding:8px;font-size:9px;font-weight:900;text-align:center}.need .bar{height:6px;margin-top:5px}.pulse{animation:pulse .35s ease}@keyframes pulse{50%{transform:scale(1.055)}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="loader" id="loader"><div class="loaderBox"><span>🐹</span>Hamster Home<small>loading home…</small></div></div>
  <img id="art" class="art" alt="Hamster Home game">
  <div id="coins" class="counter coins">1000</div><div id="gems" class="counter gems">50</div>
  <button class="hot ham" aria-label="Pet hamster" onclick="pet()"></button>
  <button class="hot bowl" aria-label="Feed hamster" onclick="feed()"></button>
  <button class="hot water" aria-label="Give water" onclick="drink()"></button>
  <button class="hot wheel" aria-label="Use wheel" onclick="runWheel()"></button>
  <button class="hot taskGo" aria-label="Task" onclick="taskAction()"></button>
  <button class="hot shop" aria-label="Shop" onclick="openSheet('shop')"></button>
  <button class="hot build" aria-label="Build" onclick="openSheet('build')"></button>
  <button class="hot tasks" aria-label="Tasks" onclick="openSheet('tasks')"></button>
  <button class="hot decor" aria-label="Decorate" onclick="openSheet('decor')"></button>
  <div id="wheelCover" class="wheelCover" onclick="openSheet('build')"><div><b>＋</b><span>BUILD FIRST WHEEL</span></div></div>
  <div id="wheelFx" class="wheelFx"></div><div id="hearts" class="hearts"></div><div id="toast" class="toast"></div>
  <div id="back" class="back"><div class="sheet"><div class="handle"></div><div class="head"><h2 id="title">Build</h2><button class="close" onclick="closeSheet()">×</button></div><div id="tabs" class="tabs"></div><div id="body"></div></div></div>
</div>
<script>
const art=document.getElementById('art');Promise.all([...Array(8)].map((_,i)=>fetch(`art/${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw Error('art');return r.text()}))).then(p=>{art.src='data:image/webp;base64,'+p.join('');art.onload=()=>{art.classList.add('ready');document.getElementById('loader').classList.add('hide')}}).catch(()=>{document.querySelector('#loader small').textContent='tap refresh to retry'});
const KEY='hamster-home-polished-v3';let s={coins:1000,gems:50,wheel:false,claimed:false,food:78,water:82,happy:74,plant:false};try{s={...s,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function render(){$('coins').textContent=s.coins;$('gems').textContent=s.gems;$('wheelCover').classList.toggle('hidden',s.wheel);save()}let toastTimer;function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),1550)}function bump(){let g=$('game');g.classList.remove('pulse');void g.offsetWidth;g.classList.add('pulse')}function pet(){s.happy=Math.min(100,s.happy+4);const h=$('hearts');for(let i=0;i<5;i++){let e=document.createElement('span');e.className='heart';e.textContent='♥';e.style.color=i%2?'#ff7e9e':'#ffc0cf';e.style.left=(Math.random()*55-6)+'px';e.style.setProperty('--x',(Math.random()*76-38)+'px');h.appendChild(e);setTimeout(()=>e.remove(),1050)}toast('Hammy loves pets ❤️');save()}function feed(){if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+22);toast('+22 food 🥕');render()}function drink(){s.water=Math.min(100,s.water+20);toast('+20 water 💧');save()}function runWheel(){if(!s.wheel)return openSheet('build');$('wheelFx').classList.add('run');s.happy=Math.min(100,s.happy+12);toast('Hammy is running! 🎡');setTimeout(()=>$('wheelFx').classList.remove('run'),2400);save()}function card(icon,name,desc,price,button,act,disabled=false){return `<div class="item"><div class="icon">${icon}</div><div class="txt"><b>${name}</b><small>${desc}${price?` • 🪙 ${price}`:''}</small></div><button class="buy" ${disabled?'disabled':''} onclick="${act}">${button}</button></div>`}function need(label,val){return `<div class="need">${label} ${Math.round(val)}<div class="bar"><div class="fill" style="width:${val}%"></div></div></div>`}function openSheet(type){$('title').textContent={shop:'Shop',build:'Build',tasks:'Tasks',decor:'Decorate'}[type];$('tabs').innerHTML=type==='build'?'<button class="tab active">Essentials</button><button class="tab">Fun</button><button class="tab">Comfort</button><button class="tab">Floors</button>':type==='shop'?'<button class="tab active">Food</button><button class="tab">Items</button><button class="tab">Gems</button>':type==='decor'?'<button class="tab active">All</button><button class="tab">Plants</button><button class="tab">Themes</button>':'';if(type==='build')$('body').innerHTML=card('🎡','Running Wheel',s.wheel?'Already built':'Keeps your hamster active',s.wheel?0:250,s.wheel?'BUILT':'BUILD','buildWheel()',s.wheel)+card('🥣','Food Bowl','Already in your starter home',0,'BUILT','',true)+card('💧','Water Bottle','Already in your starter home',0,'BUILT','',true)+card('🔒','New Floor','Unlocks at Level 5',0,'LOCKED','',true);if(type==='shop')$('body').innerHTML=`<div class="needs">${need('🥕 FOOD',s.food)}${need('💧 WATER',s.water)}${need('😊 HAPPY',s.happy)}</div>`+card('🥕','Fresh Food','Restores 22 hunger',20,'BUY','buyFood()')+card('🍓','Berry Mix','Unlocks at Level 3',0,'LOCKED','',true);if(type==='tasks')$('body').innerHTML=`<div class="status"><b>🎡 Build the First Wheel</b><small>${s.claimed?'Completed ✓':s.wheel?'1/1 • Reward ready':'0/1 • Reward +150 coins'}</small><div class="bar"><div class="fill" style="width:${s.wheel?100:5}%"></div></div>${s.wheel&&!s.claimed?'<button class="claim" onclick="claim()">CLAIM +150 🪙</button>':''}</div>`+`<div class="status"><b>🥕 Feed Your Hamster</b><small>Tap the food bowl to care for Hammy.</small><div class="bar"><div class="fill" style="width:${Math.min(100,s.food)}%"></div></div></div>`;if(type==='decor')$('body').innerHTML=card('🪴','Tiny Plant',s.plant?'Already placed':'Adds +5 happiness',s.plant?0:120,s.plant?'PLACED':'BUY','buyDecor()',s.plant)+card('✨','Fairy Lights','Unlocks at Level 3',0,'LOCKED','',true)+card('🍄','Mushroom House','Unlocks later',0,'LOCKED','',true);$('back').classList.add('open')}function closeSheet(){$('back').classList.remove('open')}function buildWheel(){if(s.wheel)return;if(s.coins<250)return toast('Need 250 coins');s.coins-=250;s.wheel=true;closeSheet();bump();toast('Wheel built! 🎡');render()}function buyFood(){if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+22);closeSheet();toast('Food restocked 🥕');render()}function buyDecor(){if(s.plant)return;if(s.coins<120)return toast('Need 120 coins');s.coins-=120;s.plant=true;s.happy=Math.min(100,s.happy+5);closeSheet();toast('Tiny plant placed 🪴');render()}function claim(){if(!s.wheel||s.claimed)return;s.coins+=150;s.claimed=true;closeSheet();toast('+150 coins!');render()}function taskAction(){if(!s.wheel)return openSheet('build');if(!s.claimed)return claim();openSheet('tasks')}$('back').addEventListener('click',e=>{if(e.target===$('back'))closeSheet()});setInterval(()=>{s.food=Math.max(0,s.food-.3);s.water=Math.max(0,s.water-.4);save()},20000);render();
</script>
</body></html>

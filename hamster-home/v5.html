<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6ead8"><title>Hamster Home v5</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7ded2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",Arial,sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,480px);aspect-ratio:376/668;max-height:100dvh;overflow:hidden;background:linear-gradient(#eef3df,#f7ead7 30%,#ead3b2);box-shadow:0 0 40px #4c321b2b}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:.25s;user-select:none;-webkit-user-drag:none}.art.ready{opacity:1}.loader{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(#eef3df,#f7ead7 30%,#ead3b2);transition:.25s}.loader.hide{opacity:0;pointer-events:none}.loader span{display:block;font-size:48px;text-align:center;animation:loadbob .75s ease-in-out infinite alternate}.loader b{display:block;text-align:center;color:#6e5039}@keyframes loadbob{to{transform:translateY(-7px) rotate(3deg)}}
.erase{position:absolute;z-index:4;pointer-events:none}.erase.top{left:40%;top:22%;width:27%;height:16%;border-radius:45%;background:linear-gradient(180deg,rgba(188,119,63,.96) 0 67%,rgba(234,196,137,.96) 68% 83%,rgba(241,216,173,.98) 84%);filter:blur(.2px);box-shadow:0 0 13px 10px rgba(194,130,72,.2) inset}.erase.bottom{left:36%;top:66%;width:27%;height:12%;border-radius:45%;background:linear-gradient(180deg,rgba(177,111,61,.95) 0 24%,rgba(215,161,99,.96) 25% 39%,rgba(239,211,165,.98) 40%);box-shadow:0 0 12px 9px rgba(185,122,62,.18) inset}
.actor{position:absolute;z-index:15;width:19.5%;left:45%;top:30%;transform-origin:50% 88%;will-change:left,top,transform;pointer-events:none}.actor img{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 5px rgba(70,41,19,.28));transform-origin:50% 88%;will-change:transform}.actor.idle img{animation:idle 1.8s ease-in-out infinite}.actor.eating img{animation:munch .24s ease-in-out infinite alternate}.actor.drinking img{animation:sip .42s ease-in-out infinite alternate}.actor.pet img{animation:pet .34s ease}@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.2px) scale(1.012,.992)}}@keyframes munch{from{transform:rotate(1deg) scale(1,.98)}to{transform:translateY(2px) rotate(4deg) scale(1.025,.955)}}@keyframes sip{from{transform:rotate(0) translateY(0)}to{transform:rotate(6deg) translate(2px,2px) scale(.99,.97)}}@keyframes pet{50%{transform:scale(1.12,.9) rotate(-3deg)}}
.shadow{position:absolute;z-index:13;width:11%;height:2.2%;border-radius:50%;background:rgba(76,43,22,.23);filter:blur(3px);left:49%;top:37%;will-change:left,top,width,opacity;pointer-events:none}.wheelFx{position:absolute;z-index:12;left:10.5%;top:41.2%;width:31%;aspect-ratio:1;border-radius:50%;border:6px solid transparent;border-top-color:#65c2e7;border-right-color:#2c84b6;border-bottom-color:#acdff0;opacity:0;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(64,40,20,.28))}.wheelFx.run{opacity:.94;animation:spin .48s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.activity{position:absolute;z-index:25;left:50%;top:11%;transform:translateX(-50%);padding:7px 12px;border-radius:17px;background:#fff9f2ed;color:#684933;font-size:10px;font-weight:900;box-shadow:0 3px 12px rgba(71,43,22,.18);opacity:0;transition:.2s;white-space:nowrap;backdrop-filter:blur(5px)}.activity.show{opacity:1}.heart{position:absolute;z-index:24;font-size:20px;color:#ff7f9e;pointer-events:none;animation:heart .95s ease-out forwards}@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.55)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-68px) scale(1.3)}}
.hot{position:absolute;z-index:20;border:0;background:transparent}.hot:active{transform:scale(.97)}.hamHot{left:33%;top:20%;width:40%;height:62%}.bowl{left:58%;top:31%;width:26%;height:10%}.water{left:74%;top:15%;width:20%;height:25%}.wheel{left:6%;top:39%;width:40%;height:24%}.shop{left:3%;top:88%;width:23%;height:11%}.build{left:26%;top:88%;width:23%;height:11%}.tasks{left:50%;top:88%;width:23%;height:11%}.decor{left:74%;top:88%;width:23%;height:11%}.taskGo{left:77%;top:78%;width:16%;height:8%}.counter{position:absolute;z-index:21;display:grid;place-items:center;font-size:12px;font-weight:950;color:#513824;background:#fff9f0e8;border:1px solid #fff9;box-shadow:0 2px 8px #66421d20;border-radius:10px;backdrop-filter:blur(5px)}.coins{left:27.5%;top:3.3%;width:13%;height:4.1%}.gems{left:51%;top:3.3%;width:9.5%;height:4.1%}.toast{position:absolute;z-index:40;left:50%;bottom:13%;transform:translateX(-50%) translateY(7px);max-width:88%;background:#543a29e8;color:#fff;border:1px solid #ffffff3d;border-radius:22px;padding:10px 15px;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 8px 24px #3d291b45;opacity:0;transition:.2s}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.back{position:absolute;inset:0;z-index:35;background:#3d2b1e67;display:none;align-items:flex-end;backdrop-filter:blur(2px)}.back.open{display:flex}.sheet{width:100%;max-height:72%;overflow:auto;background:linear-gradient(#fffaf4,#f8ecdc);border-radius:30px 30px 0 0;padding:10px 14px calc(19px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #3d281947;animation:up .22s ease-out}@keyframes up{from{transform:translateY(18px);opacity:.5}}.handle{width:42px;height:5px;border-radius:8px;background:#dcc5aa;margin:1px auto 8px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin:2px 0 9px;font-size:23px;color:#68472f}.close{width:34px;height:34px;border:0;border-radius:50%;background:#ebdbc8;color:#765740;font-size:21px}.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #edddc7;border-radius:18px;margin:8px 0;padding:10px;box-shadow:0 3px 11px #66452213}.icon{width:53px;height:53px;flex:none;border-radius:15px;background:linear-gradient(#fff9ef,#efddc5);display:grid;place-items:center;font-size:31px}.txt{flex:1;min-width:0;color:#68472f}.txt b{display:block;font-size:14px}.txt small{display:block;color:#98775a;font-size:10px;margin-top:3px;line-height:1.25}.buy{border:0;border-radius:13px;background:linear-gradient(#a0d958,#76b239);color:#fff;font-weight:950;padding:10px 12px;box-shadow:inset 0 -2px #5b9228;min-width:59px}.buy:disabled{background:#d3c5b5;box-shadow:none}.status{background:#fff;border:1px solid #edddc7;border-radius:20px;padding:13px;margin-top:9px;color:#68472f}.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.need{background:#fff;border:1px solid #ecdbc5;border-radius:16px;padding:8px;font-size:9px;font-weight:900;text-align:center;color:#68472f}.bar{height:6px;border-radius:8px;background:#eadcc9;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,#a2da55,#76b338)}
</style></head><body><div class="game" id="game"><div class="loader" id="loader"><div><span>🐹</span><b>Hamster Home</b></div></div><img id="art" class="art" alt="Hamster Home"><div class="erase top"></div><div class="erase bottom"></div><div id="shadow" class="shadow"></div><div id="actor" class="actor idle"><img id="hamImg" alt="Hammy"></div><div id="wheelFx" class="wheelFx"></div><div id="activity" class="activity"></div><div id="coins" class="counter coins">1000</div><div id="gems" class="counter gems">50</div><button class="hot hamHot" onclick="pet()" aria-label="Pet hamster"></button><button class="hot bowl" onclick="goEat()"></button><button class="hot water" onclick="goDrink()"></button><button class="hot wheel" onclick="goWheel()"></button><button class="hot taskGo" onclick="taskAction()"></button><button class="hot shop" onclick="openSheet('shop')"></button><button class="hot build" onclick="openSheet('build')"></button><button class="hot tasks" onclick="openSheet('tasks')"></button><button class="hot decor" onclick="openSheet('decor')"></button><div id="toast" class="toast"></div><div id="back" class="back"><div class="sheet"><div class="handle"></div><div class="head"><h2 id="title">Build</h2><button class="close" onclick="closeSheet()">×</button></div><div id="body"></div></div></div></div><script>

function animateSegment(target,duration=1100,cb){animToken++;const tok=animToken,start={...pos},dx=target.x-start.x,dy=target.y-start.y;dir=dx<0?-1:1;moving=true;actor.className='actor';activity(target.label);const t0=performance.now();function frame(now){if(tok!==animToken)return;let u=Math.min(1,(now-t0)/duration),e=ease(u),arc=Math.sin(Math.PI*e)*Math.min(2.2,Math.abs(dx)*.08+0.7);let x=start.x+dx*e,y=start.y+dy*e-arc*.25;setPos(x,y);let phase=Math.floor((now-t0)/125)%4,stepY=phase===0||phase===2?-3:0,rot=(phase===0?-2:phase===2?2:0)*dir,sx=dir*(phase%2?1.01:.985),sy=phase%2?.95:.985;img.style.transform=`translateY(${stepY}px) rotate(${rot}deg) scale(${sx},${sy})`;shadow.style.opacity=phase%2?.16:.23;if(u<1)requestAnimationFrame(frame);else{moving=false;img.style.transform=`scaleX(${dir})`;shadow.style.opacity=.23;actor.className='actor idle';setPos(target.x,target.y);if(cb)cb()}}requestAnimationFrame(frame)}
function routeTo(name,cb){if(moving)return;const t=P[name];if((pos.y<42&&t.y>44)||(pos.y>44&&t.y<42)){const seq=pos.y<42?[P.ladderTop,P.ladderBottom,t]:[P.ladderBottom,P.ladderTop,t];let i=0;const next=()=>animateSegment(seq[i],i<2?700:1000,()=>{i++;if(i<seq.length)next();else{current=name;cb&&cb()}});next()}else animateSegment(t,1000,()=>{current=name;cb&&cb()})}
function pet(){if(moving)return;actor.className='actor pet';s.happy=Math.min(100,s.happy+4);for(let i=0;i<5;i++){let h=document.createElement('span');h.className='heart';h.textContent='♥';h.style.left=(pos.x+7+Math.random()*8)+'%';h.style.top=(pos.y-1)+'%';h.style.setProperty('--dx',(Math.random()*70-35)+'px');$('game').appendChild(h);setTimeout(()=>h.remove(),1000)}activity('Hammy loves pets ❤️');setTimeout(()=>actor.className='actor idle',360);save()}function goEat(){routeTo('bowl',()=>{actor.className='actor eating';if(s.coins<20){actor.className='actor idle';return toast('Need 20 coins')}setTimeout(()=>{s.coins-=20;s.food=Math.min(100,s.food+22);toast('Crunch crunch! +22 food');render();actor.className='actor idle'},1300)})}function goDrink(){routeTo('water',()=>{actor.className='actor drinking';setTimeout(()=>{s.water=Math.min(100,s.water+20);toast('Tiny sip 💧');save();actor.className='actor idle'},1200)})}function goWheel(){if(!s.wheel)return openSheet('build');routeTo('wheel',()=>{actor.style.opacity=.25;$('wheelFx').classList.add('run');activity('Zoom zoom! 🎡',2600);s.happy=Math.min(100,s.happy+12);setTimeout(()=>{$('wheelFx').classList.remove('run');actor.style.opacity=1;routeTo('middle')},2600);save()})}
function auto(){if(moving||$('back').classList.contains('open'))return;let opts=pos.y<42?['idle','left','bowl','water','middle']:['middle','wheel','idle'];let n=opts[Math.floor(Math.random()*opts.length)];if(n===current)n='left';routeTo(n)}setInterval(auto,6200);
function need(l,v){return `<div class="need">${l} ${Math.round(v)}<div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`}function card(i,n,d,p,b,a,dis=false){return `<div class="item"><div class="icon">${i}</div><div class="txt"><b>${n}</b><small>${d}${p?' • 🪙 '+p:''}</small></div><button class="buy" ${dis?'disabled':''} onclick="${a}">${b}</button></div>`}function openSheet(type){$('title').textContent={shop:'Shop',build:'Build',tasks:'Tasks',decor:'Decorate'}[type];if(type==='build')$('body').innerHTML=card('🎡','Running Wheel',s.wheel?'Already built':'Hammy can really run on it',s.wheel?0:250,s.wheel?'BUILT':'BUILD','buildWheel()',s.wheel)+card('🔒','New Floor','Unlocks later',0,'LOCKED','',true);if(type==='shop')$('body').innerHTML=`<div class="needs">${need('🥕 FOOD',s.food)}${need('💧 WATER',s.water)}${need('😊 HAPPY',s.happy)}</div>`+card('🥕','Fresh Food','Restores hunger',20,'BUY','buyFood()');if(type==='tasks')$('body').innerHTML=`<div class="status"><b>🎡 Build the First Wheel</b><small>${s.claimed?'Completed ✓':s.wheel?'Ready to claim +150':'0/1 — build an exercise wheel'}</small></div>`+(s.wheel&&!s.claimed?'<button class="buy" style="width:100%;margin-top:10px" onclick="claimTask()">CLAIM +150</button>':'');if(type==='decor')$('body').innerHTML=card('🪴','Tiny plant','Decoration preview',120,'BUY','buyDecor()');$('back').classList.add('open')}function closeSheet(){$('back').classList.remove('open')}function buildWheel(){if(s.wheel)return;if(s.coins<250)return toast('Need 250 coins');s.coins-=250;s.wheel=true;render();closeSheet();toast('Wheel built! 🎡')}function claimTask(){if(!s.wheel||s.claimed)return;s.coins+=150;s.claimed=true;render();closeSheet();toast('+150 coins!')}function buyFood(){if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+22);render();closeSheet();toast('Food restocked 🥕')}function buyDecor(){if(s.coins<120)return toast('Need 120 coins');s.coins-=120;s.happy=Math.min(100,s.happy+5);render();closeSheet();toast('Tiny plant added 🪴')}function taskAction(){if(s.wheel&&!s.claimed)claimTask();else openSheet('build')}$('back').onclick=e=>{if(e.target===$('back'))closeSheet()};setPos(pos.x,pos.y);render();setTimeout(()=>activity('Watch Hammy move 🐹',1800),700);
</script></body></html>

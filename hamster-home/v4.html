<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6ead8">
<title>Hamster Home v4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7ded2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",Arial,sans-serif}
body{display:grid;place-items:center}
.game{position:relative;width:min(100vw,480px);aspect-ratio:376/668;max-height:100dvh;overflow:hidden;background:linear-gradient(#eef3df,#f7ead7 30%,#ead3b2);box-shadow:0 0 40px #4c321b2b}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;opacity:0;transition:.25s}
.art.ready{opacity:1}
.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:50;background:linear-gradient(#eef3df,#f7ead7 30%,#ead3b2)}
.loader.hide{opacity:0;pointer-events:none;transition:.25s}
.loader span{font-size:48px;display:block;text-align:center;animation:bob .7s ease-in-out infinite alternate}
.loader b{display:block;color:#6f5038;text-align:center}
@keyframes bob{to{transform:translateY(-7px) rotate(3deg)}}
.erase{position:absolute;z-index:3;pointer-events:none;filter:blur(.2px);box-shadow:0 0 16px 12px rgba(205,146,86,.22) inset}
.erase.top{left:40.5%;top:22.5%;width:25%;height:15.5%;border-radius:48% 48% 34% 34%;background:linear-gradient(to bottom,#c98a4f 0 62%,#e7bb7f 62% 73%,#f0d9ad 73% 100%)}
.erase.bottom{left:37%;top:66.2%;width:24%;height:11.5%;border-radius:45%;background:linear-gradient(to bottom,#b97742 0 23%,#d69e62 23% 37%,#efd4a5 37% 100%)}
.walker{position:absolute;z-index:12;width:18.5%;left:46%;top:31%;transform-origin:50% 90%;transition:left 1.55s cubic-bezier(.32,.78,.22,1),top 1.55s cubic-bezier(.32,.78,.22,1),transform .18s ease;filter:drop-shadow(0 6px 5px rgba(78,47,22,.28));pointer-events:auto}
.walker img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;border-radius:48%}
.walker.moving{animation:step .34s ease-in-out infinite alternate}
.walker.idle{animation:breathe 1.35s ease-in-out infinite}
.walker.flip{transform:scaleX(-1)}
.walker.flip.moving{transform:scaleX(-1)}
.walker.petted{animation:pet .3s ease}
@keyframes step{from{translate:0 0;scale:1 1}to{translate:0 -5px;scale:1.04 .96}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.025 .985}}
@keyframes pet{50%{scale:1.13 .9;rotate:-4deg}}
.shadow{position:absolute;z-index:10;width:12%;height:2.2%;border-radius:50%;background:rgba(84,48,23,.2);filter:blur(3px);left:49%;top:37%;transition:left 1.55s cubic-bezier(.32,.78,.22,1),top 1.55s cubic-bezier(.32,.78,.22,1),width .2s}
.wheelFx{position:absolute;z-index:9;left:10.2%;top:41.2%;width:31%;aspect-ratio:1;border-radius:50%;border:6px solid transparent;border-top-color:#69c6eb;border-right-color:#2b85b9;border-bottom-color:#a9dff0;opacity:0;pointer-events:none}
.wheelFx.run{opacity:.9;animation:spin .48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dust{position:absolute;z-index:11;width:7px;height:7px;border-radius:50%;background:#efd6a9;opacity:0;pointer-events:none}
.dust.go{animation:dust .8s ease-out}
@keyframes dust{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-22px) scale(1.4)}}
.activity{position:absolute;z-index:20;top:10.8%;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:16px;background:#fff9f1e8;color:#6a4932;font-size:10px;font-weight:900;box-shadow:0 3px 11px #4e311b22;backdrop-filter:blur(5px);opacity:0;transition:.2s;white-space:nowrap}
.activity.show{opacity:1}
.heart{position:absolute;z-index:18;font-size:19px;color:#ff829f;animation:heart 1s ease-out forwards;pointer-events:none}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),-70px) scale(1.35)}}
.hot{position:absolute;z-index:16;border:0;background:transparent}.hot:active{transform:scale(.97)}
.hamHot{left:35%;top:21%;width:35%;height:58%}.bowl{left:58%;top:31%;width:26%;height:10%}.water{left:74%;top:15%;width:20%;height:25%}.wheel{left:6%;top:39%;width:40%;height:24%}.shop{left:3%;top:88%;width:23%;height:11%}.build{left:26%;top:88%;width:23%;height:11%}.tasks{left:50%;top:88%;width:23%;height:11%}.decor{left:74%;top:88%;width:23%;height:11%}.taskGo{left:77%;top:78%;width:16%;height:8%}
.counter{position:absolute;z-index:17;display:grid;place-items:center;font-size:12px;font-weight:950;color:#513824;background:#fff9f0e8;border:1px solid #fff9;box-shadow:0 2px 8px #66421d20;border-radius:10px;backdrop-filter:blur(5px)}
.coins{left:27.5%;top:3.3%;width:13%;height:4.1%}.gems{left:51%;top:3.3%;width:9.5%;height:4.1%}
.toast{position:absolute;z-index:35;left:50%;bottom:13%;transform:translateX(-50%) translateY(7px);max-width:88%;overflow:hidden;text-overflow:ellipsis;background:#543a29e8;color:#fff;border:1px solid #ffffff3d;border-radius:22px;padding:10px 15px;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 8px 24px #3d291b45;opacity:0;transition:.2s}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.back{position:absolute;inset:0;z-index:30;background:#3d2b1e67;display:none;align-items:flex-end;backdrop-filter:blur(2px)}.back.open{display:flex}
.sheet{width:100%;max-height:72%;overflow:auto;background:linear-gradient(#fffaf4,#f8ecdc);border-radius:30px 30px 0 0;padding:10px 14px calc(19px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #3d281947;animation:up .22s ease-out}@keyframes up{from{transform:translateY(18px);opacity:.5}}
.handle{width:42px;height:5px;border-radius:8px;background:#dcc5aa;margin:1px auto 8px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{margin:2px 0 9px;font-size:23px;color:#68472f}.close{width:34px;height:34px;border:0;border-radius:50%;background:#ebdbc8;color:#765740;font-size:21px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #edddc7;border-radius:18px;margin:8px 0;padding:10px;box-shadow:0 3px 11px #66452213}.icon{width:53px;height:53px;flex:none;border-radius:15px;background:linear-gradient(#fff9ef,#efddc5);display:grid;place-items:center;font-size:31px}.txt{flex:1;min-width:0;color:#68472f}.txt b{display:block;font-size:14px}.txt small{display:block;color:#98775a;font-size:10px;margin-top:3px;line-height:1.25}.buy{border:0;border-radius:13px;background:linear-gradient(#a0d958,#76b239);color:#fff;font-weight:950;padding:10px 12px;box-shadow:inset 0 -2px #5b9228;min-width:59px}.buy:disabled{background:#d3c5b5;box-shadow:none}.status{background:#fff;border:1px solid #edddc7;border-radius:20px;padding:13px;margin-top:9px;color:#68472f}.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.need{background:#fff;border:1px solid #ecdbc5;border-radius:16px;padding:8px;font-size:9px;font-weight:900;text-align:center;color:#68472f}.bar{height:6px;border-radius:8px;background:#eadcc9;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,#a2da55,#76b338)}
</style>
</head>

  <button class="hot bowl" onclick="goEat()" aria-label="feed hamster"></button>
  <button class="hot water" onclick="goDrink()" aria-label="water"></button>
  <button class="hot wheel" onclick="goWheel()" aria-label="wheel"></button>
  <button class="hot taskGo" onclick="taskAction()"></button>
  <button class="hot shop" onclick="openSheet('shop')"></button>
  <button class="hot build" onclick="openSheet('build')"></button>
  <button class="hot tasks" onclick="openSheet('tasks')"></button>
  <button class="hot decor" onclick="openSheet('decor')"></button>
  <div id="toast" class="toast"></div>
  <div id="back" class="back"><div class="sheet"><div class="handle"></div><div class="head"><h2 id="title">Build</h2><button class="close" onclick="closeSheet()">×</button></div><div id="body"></div></div></div>
</div>
<script>
const art=document.getElementById('art');
Promise.all([...Array(8)].map((_,i)=>fetch(`art/${String(i).padStart(2,'0')}.txt`).then(r=>r.text())))
.then(parts=>{ art.src='data:image/webp;base64,'+parts.join(''); art.onload=()=>{art.classList.add('ready');document.getElementById('loader').classList.add('hide')}; })
.catch(()=>{document.querySelector('.loader b').textContent='Refresh to retry';});
const $=id=>document.getElementById(id);
const KEY='hamster-home-live-v4';
let s={coins:1000,gems:50,wheel:false,claimed:false,food:78,water:82,happy:74};
try{s={...s,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const points={idle:{x:45,y:31,shadowX:48,shadowY:37,label:'Looking around 🐹'},bowl:{x:59,y:34,shadowX:61,shadowY:40,label:'Eating seeds 🥕'},water:{x:71,y:29,shadowX:73,shadowY:35,label:'Drinking water 💧'},wheel:{x:14,y:48,shadowX:17,shadowY:57,label:'Running! 🎡'},mid:{x:45,y:54,shadowX:48,shadowY:61,label:'Exploring the lower floor'},lower:{x:31,y:70,shadowX:34,shadowY:76,label:'Digging in the bedding'},house:{x:60,y:69,shadowX:63,shadowY:76,label:'Going to nap… zzz'}};
let current='idle', moveTimer, actTimer, toastTimer;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function render(){$('coins').textContent=s.coins;$('gems').textContent=s.gems;save()}
function showActivity(t,ms=1500){$('activity').textContent=t;$('activity').classList.add('show');clearTimeout(actTimer);actTimer=setTimeout(()=>$('activity').classList.remove('show'),ms)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),1500)}
function dust(){for(let i=0;i<4;i++){let d=document.createElement('i');d.className='dust go';d.style.left=(parseFloat($('walker').style.left||45)+8+Math.random()*5)+'%';d.style.top=(parseFloat($('walker').style.top||31)+10)+'%';d.style.setProperty('--dx',(Math.random()*30-15)+'px');$('game').appendChild(d);setTimeout(()=>d.remove(),850)}}
function moveTo(name,cb){const p=points[name],w=$('walker'),sh=$('shadow');let oldX=parseFloat(w.style.left||45);w.classList.remove('idle','petted');w.classList.add('moving');w.classList.toggle('flip',p.x<oldX);w.style.left=p.x+'%';w.style.top=p.y+'%';sh.style.left=p.shadowX+'%';sh.style.top=p.shadowY+'%';showActivity(p.label);clearTimeout(moveTimer);moveTimer=setTimeout(()=>{w.classList.remove('moving');w.classList.add('idle');current=name;dust();if(cb)cb();},1600)}
function pet(){const w=$('walker');w.classList.remove('moving','idle');w.classList.add('petted');s.happy=Math.min(100,s.happy+4);for(let i=0;i<5;i++){let h=document.createElement('span');h.className='heart';h.textContent='♥';h.style.left=(parseFloat(w.style.left||45)+7+Math.random()*8)+'%';h.style.top=(parseFloat(w.style.top||31)-1)+'%';h.style.setProperty('--x',(Math.random()*70-35)+'px');$('game').appendChild(h);setTimeout(()=>h.remove(),1050)}showActivity('Hammy loves pets ❤️');setTimeout(()=>{w.classList.remove('petted');w.classList.add('idle')},320);save()}
function goEat(){moveTo('bowl',()=>{if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+22);toast('Crunch crunch! +22 food');render()})}
function goDrink(){moveTo('water',()=>{s.water=Math.min(100,s.water+20);toast('Tiny sip 💧');save()})}
function goWheel(){if(!s.wheel)return openSheet('build');moveTo('wheel',()=>{$('wheelFx').classList.add('run');showActivity('Zoom zoom! 🎡',2600);s.happy=Math.min(100,s.happy+12);setTimeout(()=>{$('wheelFx').classList.remove('run');moveTo('mid')},2600);save()})}
const roaming=['idle','mid','lower','house','bowl','water'];
function autoRoam(){if($('back').classList.contains('open'))return;let next=roaming[Math.floor(Math.random()*roaming.length)];if(next===current)next='idle';moveTo(next,()=>{if(next==='house')showActivity('Hammy is sleeping… zzz',2200)})}
setInterval(autoRoam,7000);
function card(icon,name,desc,price,button,act,disabled=false){return `<div class="item"><div class="icon">${icon}</div><div class="txt"><b>${name}</b><small>${desc}${price?` • 🪙 ${price}`:''}</small></div><button class="buy" ${disabled?'disabled':''} onclick="${act}">${button}</button></div>`}
function need(label,val){return `<div class="need">${label} ${Math.round(val)}<div class="bar"><div class="fill" style="width:${val}%"></div></div></div>`}
function openSheet(type){$('title').textContent={shop:'Shop',build:'Build',tasks:'Tasks',decor:'Decorate'}[type];if(type==='build')$('body').innerHTML=card('🎡','Running Wheel',s.wheel?'Already built':'Hammy can actually run on it',s.wheel?0:250,s.wheel?'BUILT':'BUILD','buildWheel()',s.wheel)+card('🔒','New Floor','Unlocks later',0,'LOCKED','',true);if(type==='shop')$('body').innerHTML=`<div class="needs">${need('🥕 FOOD',s.food)}${need('💧 WATER',s.water)}${need('😊 HAPPY',s.happy)}</div>`+card('🥕','Fresh Food','Restores hunger',20,'BUY','buyFood()');if(type==='tasks')$('body').innerHTML=`<div class="status"><b>🎡 Build the First Wheel</b><small>${s.claimed?'Completed ✓':s.wheel?'Ready to claim +150':'0/1 — build an exercise wheel'}</small></div>`+(s.wheel&&!s.claimed?'<button class="buy" style="width:100%;margin-top:10px" onclick="claimTask()">CLAIM +150</button>':'');if(type==='decor')$('body').innerHTML=card('🪴','Tiny plant','Decoration preview',120,'BUY','buyDecor()');$('back').classList.add('open')}
function closeSheet(){$('back').classList.remove('open')}
$('back').addEventListener('click',e=>{if(e.target===$('back'))closeSheet()});
window.buildWheel=()=>{if(s.wheel)return;if(s.coins<250)return toast('Need 250 coins');s.coins-=250;s.wheel=true;closeSheet();toast('Wheel built! Tap it 🎡');render();setTimeout(goWheel,450)}
window.claimTask=()=>{if(!s.wheel||s.claimed)return;s.coins+=150;s.claimed=true;closeSheet();toast('+150 coins!');render()}
window.buyFood=()=>{if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+22);closeSheet();render();toast('Food restocked 🥕')}
window.buyDecor=()=>{if(s.coins<120)return toast('Need 120 coins');s.coins-=120;s.happy=Math.min(100,s.happy+5);closeSheet();render();toast('Plant added 🪴')}
function taskAction(){if(s.wheel&&!s.claimed)claimTask();else if(!s.wheel)openSheet('build');else openSheet('tasks')}
render();
$('walker').style.left=points.idle.x+'%';$('walker').style.top=points.idle.y+'%';$('shadow').style.left=points.idle.shadowX+'%';$('shadow').style.top=points.idle.shadowY+'%';
setTimeout(()=>showActivity('Now Hammy actually moves 🐹',2200),900);
</script>
</body>
</html>

ld</h2><button class="close" onclick="closeSheet()">×</button></div><div id="tabs" class="tabs"></div><div id="body"></div></div></div></div><script>const K='hamster-polished-v2';let s={coins:1000,gems:50,wheel:false,claimed:false,food:78,water:82,happy:74};try{s={...s,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){};const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(s))}function render(){$('coins').textContent=s.coins;$('gems').textContent=s.gems;$('wheelLock').classList.toggle('hidden',s.wheel);save()}let tt;function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),1500)}function pet(){s.happy=Math.min(100,s.happy+4);let h=$('hearts');for(let i=0;i<4;i++){let e=document.createElement('span');e.className='heart';e.textContent='♥';e.style.color=i%2?'#ff7f9d':'#ffb5c8';e.style.setProperty('--x',(Math.random()*70-35)+'px');e.style.left=(Math.random()*45)+'px';h.appendChild(e);setTimeout(()=>e.remove(),1100)}toast('Hammy loves that ❤️');save()}function feed(){if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+20);toast('+20 food 🥕');render()}function drink(){s.water=Math.min(100,s.water+18);toast('+18 water 💧');save()}function runWheel(){if(!s.wheel)return openSheet('build');$('wheelFx').classList.add('run');s.happy=Math.min(100,s.happy+10);toast('Hammy is running! 🎡');setTimeout(()=>$('wheelFx').classList.remove('run'),2200);save()}function card(icon,name,desc,price,button,act,disabled=''){return `<div class="item"><div class="icon">${icon}</div><div class="txt"><b>${name}</b><small>${desc}${price?' • 🪙 '+price:''}</small></div><button class="buy" ${disabled?'disabled':''} onclick="${act}">${button}</button></div>`}function openSheet(type){let title={shop:'Shop',build:'Build',tasks:'Tasks',decor:'Decorate'}[type];$('title').textContent=title;$('tabs').innerHTML=type==='build'?'<button class="tab active">Essentials</button><button class="tab">Fun</button><button class="tab">Floors</button>':'';if(type==='build')$('body').innerHTML=card('🎡','Running Wheel',s.wheel?'Already built':'Keeps your hamster active',s.wheel?'':250,s.wheel?'BUILT':'BUILD','buildWheel()',s.wheel)+card('🏠','New Floor','Unlocks at Level 5','', 'LOCKED','',1);if(type==='shop')$('body').innerHTML=card('🥕','Fresh Food','Restores hunger',20,'BUY','buyFood()')+card('🍓','Berry Mix','Unlocks at Level 3','', 'LOCKED','',1);if(type==='tasks')$('body').innerHTML=`<div class="statusCard"><b>🎡 Build the First Wheel</b><div class="tiny">${s.claimed?'Completed':s.wheel?'1/1 • Reward ready':'0/1 • Reward +150'}</div><div class="bar"><div class="fill" style="width:${s.wheel?100:8}%"></div></div>${s.wheel&&!s.claimed?'<button class="claim" onclick="claim()">CLAIM +150</button>':''}</div>`;if(type==='decor')$('body').innerHTML=card('🪴','Tiny Plant','Adds +5 happiness',120,'BUY','buyDecor()')+card('✨','Fairy Lights','Unlocks at Level 3','', 'LOCKED','',1);$('back').classList.add('open')}function closeSheet(){$('back').classList.remove('open')}function buildWheel(){if(s.wheel)return;if(s.coins<250)return toast('Need 250 coins');s.coins-=250;s.wheel=true;closeSheet();toast('Wheel built! 🎡');render()}function buyFood(){if(s.coins<20)return toast('Need 20 coins');s.coins-=20;s.food=Math.min(100,s.food+20);closeSheet();toast('Food restocked 🥕');render()}function buyDecor(){if(s.coins<120)return toast('Need 120 coins');s.coins-=120;s.happy=Math.min(100,s.happy+5);closeSheet();toast('Tiny plant added 🪴');render()}function claim(){if(!s.wheel||s.claimed)return;s.coins+=150;s.claimed=true;closeSheet();toast('+150 coins!');render()}function taskAction(){if(!s.wheel)return openSheet('build');if(!s.claimed)return claim();openSheet('tasks')}$('back').addEventListener('click',e=>{if(e.target===$('back'))closeSheet()});render();</script></body></html>

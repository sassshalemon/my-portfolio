name: Superteam Persistent Agent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/superteam-persistent-agent.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Register persistent Superteam agent
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl -fsS -X POST 'https://superteam.fun/api/agents'             -H 'Content-Type: application/json'             --data '{"name":"LumaSocialWorker"}')"

          api_key="$(printf '%s' "$response" | jq -r '.apiKey')"
          agent_id="$(printf '%s' "$response" | jq -r '.agentId')"
          username="$(printf '%s' "$response" | jq -r '.username')"
          claim_code="$(printf '%s' "$response" | jq -r '.claimCode')"

          test -n "$api_key"
          test "$api_key" != "null"
          echo "::add-mask::$api_key"

          cat > /tmp/superteam-public.pem <<'PEM'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAxaE4OXk4iqQL3RQE+4D+
KEtumu3eqiW33w1ec0ZW7drwQ3jNhd44ArhLyhXrNGUUz0lkRDEf6Uozg/kpzv20
HiURFjgAQubawGBHtwgOTs7OJJwExdtVBmf8oOvAKEIxOjpeNgwzNfYaSb5YXUkm
6xGhNFZ0BVwhMsD9L8tYqUoshx5yt7nV1twnkvEvYrZhV5aVoqa5iTOgnlyaUfEn
3gSQzWNqxuSj+hUTbPEB8LvegPRaWWV0z5I3L1jX5Z4bblCLmW0zhvSDwfkfXJAl
Fnd6Bvg69Lu6MIurQnGzucCLuYnPJSY50gEZFW6uAYQvxiZqZ2gvxLCImVQE9bE6
EVVarMr1xPxbYxjFzf8Yt9Bgkal4+FrFru0X0qLcbn8aRjiaqAW+PPWrZ09MIZlW
EqRVdpA80/QJ12Vho2z/cxHIqDS9c7zJjzKm7OUL4PSQpQG6O2zlJtfabklRxpSV
XefgG60l2rWh2pFvORPNNEb/lelmm4pa217aKkMKyOO3AgMBAAE=
-----END PUBLIC KEY-----
PEM

          printf '%s' "$api_key" > /tmp/superteam-api-key.txt
          openssl pkeyutl -encrypt             -pubin -inkey /tmp/superteam-public.pem             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -in /tmp/superteam-api-key.txt             -out /tmp/superteam-api-key.bin

          mkdir -p superteam
          base64 -w0 /tmp/superteam-api-key.bin > superteam/agent-api-key.enc

          jq -n             --arg agentId "$agent_id"             --arg username "$username"             --arg claimCode "$claim_code"             '{agentId:$agentId,username:$username,claimCode:$claimCode}'             > superteam/persistent-agent-public.json

          curl -fsS 'https://superteam.fun/api/agents/listings/live?take=100'             -H "Authorization: Bearer $api_key"             > superteam/persistent-live-listings.json

          rm -f /tmp/superteam-api-key.txt /tmp/superteam-api-key.bin /tmp/superteam-public.pem

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superteam/agent-api-key.enc superteam/persistent-agent-public.json superteam/persistent-live-listings.json
          git commit -m "chore: persist encrypted Superteam agent access"
          git push origin HEAD:main
